name: Radio Client Rust previews

on:
  push:
    branches: [radio-client-rust]
    paths:
      - '.github/workflows/radio-rust-preview.yml'
      - 'Cargo.*'
      - 'crates/**'
      - 'packaging/android/**'
      - 'third_party/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    concurrency:
      group: radio-rust-preview-linux-x86_64-${{ github.ref }}
      cancel-in-progress: false
    name: Linux x86-64 engine preview
    if: github.ref == 'refs/heads/radio-client-rust'
    # Keep the Linux executable usable on hosts with Ubuntu 24.04-era glibc.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: radio-engine-preview-linux
      - name: Build inherited game client and 1.21.11 probe
        run: |
          cargo build --locked --profile quick -p horizon-client --bin horizon-client
          cargo build --locked --profile quick -p horizon-client-lib --example radio_12111_probe
          game_home=$(mktemp -d)
          HORIZON_HOME="$game_home/game" HORIZON_LAUNCHER_HOME="$game_home/launcher" XDG_DATA_HOME="$game_home/data" XDG_CONFIG_HOME="$game_home/config" HORIZON_NO_AUDIO=1 HORIZON_LAUNCHER_NO_SELF_UPDATE=1 target/quick/horizon-client --help
          tar -czf radio-linux-x86_64.tar.gz -C target/quick horizon-client examples/radio_12111_probe -C ../.. LICENSE THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@v4
        with:
          name: radio-linux-x86_64-engine-preview
          path: radio-linux-x86_64.tar.gz
          if-no-files-found: error

  android:
    concurrency:
      group: radio-rust-preview-android-arm64-${{ github.ref }}
      cancel-in-progress: false
    name: Android ARM64 engine preview
    if: github.ref == 'refs/heads/radio-client-rust'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Load the persistent preview signing key
        env:
          KEYSTORE: ${{ secrets.STARLING_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Configure STARLING_DEBUG_KEYSTORE_BASE64 to publish previews that can update in place."
            exit 1
          fi
          umask 077
          mkdir -p target/android
          printf '%s' "$KEYSTORE" | base64 -d > target/android/debug.keystore
          test -s target/android/debug.keystore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358" > /dev/null
          cargo install cargo-ndk --version 3.5.4 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          key: radio-engine-preview-arm64
      - name: Build the update-compatible preview APK
        # Leave room above older previews, which used the fixed version code 13.
        run: |
          python3 packaging/android/build_apk.py --abi arm64-v8a --profile quick --preview \
            --version-code "$((1000 + GITHUB_RUN_NUMBER))"
      - uses: actions/upload-artifact@v4
        with:
          name: radio-android-arm64-engine-preview
          path: target/android/starling-*.apk
          if-no-files-found: error
