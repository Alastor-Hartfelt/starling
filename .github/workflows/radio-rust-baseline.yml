name: Radio Client Rust baseline

on:
  push:
    branches: [radio-client-rust]
  pull_request:
    branches: [radio-client-rust]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radio-rust-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-baseline:
    name: Check inherited desktop client
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: radio-rust-desktop
      - name: Check desktop client (inherited 26.3 baseline)
        run: cargo check --locked -p horizon-client
      - name: Test multiplayer session and keepalive handling
        run: |
          cargo test --locked -p horizon-client-lib --lib net::tests::

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Join a vanilla 1.21.11 server with the headless probe
        timeout-minutes: 10
        run: |
          cargo build --locked -p horizon-client-lib --example radio_12111_probe
          jar="$RUNNER_TEMP/minecraft-server-1.21.11.jar"
          curl --fail --silent --show-error --location --retry 3 --output "$jar" "https://piston-data.mojang.com/v1/objects/64bb6d763bed0a9f1d632ec347938594144943ed/server.jar"
          echo "64bb6d763bed0a9f1d632ec347938594144943ed  $jar" | sha1sum --check
          python3 tools/radio_12111_smoke.py "$jar" target/debug/examples/radio_12111_probe

  protocol-baseline:
    name: Check inherited Rust protocol crate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: radio-rust-protocol
      - name: Check protocol crate (inherited 26.3 baseline, not a 1.21.11 verification)
        run: cargo check --locked -p horizon-protocol
      - name: Test protocol codecs, framing and version adapters
        run: cargo test --locked -p horizon-protocol --lib
